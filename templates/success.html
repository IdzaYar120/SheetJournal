<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал створено — {{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes checkmark {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(-45deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-check { animation: checkmark 0.6s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center p-4">

    <div class="w-full max-w-lg">
        <div class="bg-white/10 backdrop-blur-xl border border-white/15 rounded-2xl shadow-2xl p-8 text-center">

            <!-- Success icon -->
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-500/20 mb-6 animate-check">
                <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-white mb-2">Журнал успішно створено!</h1>
            <p class="text-slate-400 text-sm mb-6">
                Google Sheets таблиця <span class="text-indigo-300 font-medium">«{{ title }}»</span> готова до використання.
            </p>

            <!-- Info cards -->
            <div class="space-y-3 mb-8 text-left">
                <div class="bg-white/5 rounded-xl px-4 py-3 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500">Кількість вкладок (дисциплін)</p>
                        <p class="text-sm text-white font-medium">{{ tab_count }}</p>
                    </div>
                </div>

                {% if shared_with %}
                <div class="bg-white/5 rounded-xl px-4 py-3 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500">Поширено на</p>
                        <p class="text-sm text-white font-medium">{{ shared_with }}</p>
                    </div>
                </div>
                {% endif %}
            </div>

            <!-- Action buttons -->
            <div class="space-y-3">
                <a href="{{ spreadsheet_url }}" target="_blank" rel="noopener noreferrer"
                   class="flex items-center justify-center gap-2 w-full py-3 px-4 rounded-xl font-semibold text-sm
                          bg-emerald-600 text-white hover:bg-emerald-500 active:scale-[0.98]
                          transition-all duration-200 shadow-lg shadow-emerald-500/25">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                    </svg>
                    Відкрити в Google Sheets
                </a>

                <a href="{{ url_for('upload_page') }}"
                   class="flex items-center justify-center gap-2 w-full py-3 px-4 rounded-xl font-semibold text-sm
                          bg-white/10 text-slate-300 hover:bg-white/15 active:scale-[0.98]
                          transition-all duration-200 border border-white/10">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                    </svg>
                    Створити ще один журнал
                </a>
            </div>
        </div>

        <p class="text-center text-slate-600 text-xs mt-6">
            Фаза 2 — Інтеграція з Google Sheets
        </p>
    </div>
</body>
</html>
