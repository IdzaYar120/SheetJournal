name: Build Windows .exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # The exe commit below must not trigger another build.
    paths-ignore: ["SheetJournal.exe"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

# Only one build per branch at a time, so the exe commits don't race.
concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      # antiword (needed for legacy .doc files). Look for it in Git for
      # Windows first, then fall back to installing it from the runner's
      # preinstalled MSYS2. Copy it together with the DLLs it links against
      # so the .exe works on machines without Git.
      - name: Bundle antiword
        shell: bash
        run: |
          src=$(find "/c/Program Files/Git" -iname antiword.exe 2>/dev/null | head -1)
          if [ -z "$src" ] && [ -x /c/msys64/usr/bin/bash.exe ]; then
            /c/msys64/usr/bin/bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-antiword || pacman -S --noconfirm --needed antiword" || true
            src=$(find /c/msys64 -iname antiword.exe 2>/dev/null | head -1)
          fi
          if [ -z "$src" ]; then
            echo "::warning::antiword.exe not found; .doc import will need Git for Windows (with antiword) on the target machine"
            exit 0
          fi
          echo "Using $src"
          bindir=$(dirname "$src")
          root=$(dirname "$bindir")
          mkdir -p antiword/share
          cp "$src" antiword/
          # Copy every non-system DLL it depends on (they live next to it).
          PATH="$bindir:$PATH" ldd "$src" | awk '{print $3}' | grep -iv '/c/windows/' | grep -i '\.dll$' | xargs -r -I{} cp {} antiword/ || true
          [ -d "$root/share/antiword" ] && cp -r "$root/share/antiword/." antiword/share/
          ls -la antiword antiword/share
          # Verify it starts without Git/MSYS2 on PATH (i.e. all DLLs are bundled).
          out=$(PATH=/c/Windows/System32 ./antiword/antiword.exe 2>&1 || true)
          echo "$out" | head -5
          echo "$out" | grep -qi "antiword" || { echo "::error::bundled antiword failed to start"; exit 1; }

      - name: Smoke-test journal generation
        run: python smoke_test.py

      - name: Build .exe
        run: pyinstaller --noconfirm SheetJournal.spec

      - uses: actions/upload-artifact@v4
        with:
          name: SheetJournal-windows
          path: dist/SheetJournal.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SheetJournal.exe

      # Keep a ready-to-run SheetJournal.exe in the root of main, so that
      # "Code -> Download ZIP" already contains the program.
      - name: Commit .exe to main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cp dist/SheetJournal.exe SheetJournal.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SheetJournal.exe
          git commit -m "Update SheetJournal.exe (built from ${GITHUB_SHA::7}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
